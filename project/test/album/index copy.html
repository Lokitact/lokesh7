<!DOCTYPE html>
<html
  lang="en"
  data-loki-theme="auto"
  data-loki-theme-color="green"
  class="h-100"
>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Interactive Flipping Book</title>

    <!-- Vendor CSS -->
    <link
      href="../assets/vendor/bootstrap/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="../assets/vendor/bootstrap-icons/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link href="../assets/css/loki.css" rel="stylesheet" />

    <script>
      document.documentElement.setAttribute(
        "data-loki-theme-color",
        localStorage.getItem("data-loki-theme-color")
      );
      document.documentElement.setAttribute(
        "data-loki-theme",
        localStorage.getItem("theme")
      );
      document.documentElement.setAttribute(
        "data-bs-theme",
        localStorage.getItem("theme")
      );
    </script>

    <style>
      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }
      .book-container {
        perspective: 1500px;
        position: relative;
      }
      .book {
        width: 600px;
        height: 400px;
        position: relative;
        transform-style: preserve-3d;
      }
      .page {
        position: absolute;
        width: 50%;
        height: 100%;
        transform-style: preserve-3d;
        transition: transform 0.8s cubic-bezier(0.645, 0.045, 0.355, 1);
        overflow: hidden;
        background: white;
      }
      .page.right {
        right: 0;
        transform-origin: left center;
        border-radius: 0 10px 10px 0;
        z-index: 2;
      }
      .page.left {
        left: 0;
        transform-origin: right center;
        border-radius: 10px 0 0 10px;
        z-index: 1;
      }
      .page-content {
        position: absolute;
        width: 100%;
        height: 100%;
        backface-visibility: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .page-front {
        background: #f5f7fa;
      }
      .page-back {
        background: #e3ffe7;
        transform: rotateY(180deg);
      }
      .page.right.flipped {
        transform: rotateY(-180deg);
      }
      .page.left.flipped {
        transform: rotateY(180deg);
      }
      .photo {
        width: 220px;
        height: 280px;
        object-fit: cover;
        border-radius: 10px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      }
      .photo-placeholder {
        width: 220px;
        height: 280px;
        background: #eee;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2em;
        border-radius: 10px;
      }
      .welcome-text {
        font-size: 2em;
        font-weight: bold;
        color: #444;
      }
      .book-spine {
        position: absolute;
        left: 50%;
        top: 0;
        width: 4px;
        height: 100%;
        background: #654321;
        transform: translateX(-50%);
        z-index: 10;
      }
      .controls {
        text-align: center;
        margin-top: 20px;
      }
      button {
        padding: 10px 20px;
        margin: 5px;
        border: none;
        border-radius: 5px;
        background: #444;
        color: white;
        cursor: pointer;
      }
      button:disabled {
        background: #aaa;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <div class="book-container">
      <div class="book" id="book">
        <div class="book-spine"></div>
      </div>
      <div class="controls">
        <button id="prevBtn" onclick="previousPage()">← Previous</button>
        <button id="nextBtn" onclick="nextPage()">Next →</button>
        <button onclick="resetBook()">Reset</button>
      </div>
    </div>

   <script>
  // Put front cover at start and back cover at end
  const photos = [
    "./front cover.jpg", // always first
    "./1.jpg",
    "./2.jpg",
    "./3.jpg",
    "./4.jpg",
    "./5.jpg",
    "./6.jpg",
    "./back cover.jpg" // always last
  ];

  const book = document.getElementById("book");
  let pages = [];
  let currentPage = 0;

  // --- Front Cover Page ---
  const coverPage = document.createElement("div");
  coverPage.className = "page right";
  coverPage.innerHTML = `
    <div class="page-content page-front">
      <img src="${photos[0]}" class="photo"
        onerror="this.parentNode.innerHTML='<div class=welcome-text>Welcome</div>'">
    </div>
    <div class="page-content page-back"></div>
  `;
  book.appendChild(coverPage);
  pages.push(coverPage);

  // --- Inside Pages (skip index 0 = cover, last = back cover) ---
  for (let i = 1; i < photos.length - 1; i += 2) {
    const page = document.createElement("div");
    page.className = "page right";
    page.innerHTML = `
      <div class="page-content page-front">
        <img src="${photos[i] || ""}" class="photo"
          onerror="this.parentNode.innerHTML='<div class=photo-placeholder>📷</div>'">
      </div>
      <div class="page-content page-back">
        <img src="${photos[i + 1] || ""}" class="photo"
          onerror="this.parentNode.innerHTML='<div class=photo-placeholder>📷</div>'">
      </div>
    `;
    book.appendChild(page);
    pages.push(page);
  }

  // --- Back Cover Page ---
  const backCover = document.createElement("div");
  backCover.className = "page right";
  backCover.innerHTML = `
    <div class="page-content page-front"></div>
    <div class="page-content page-back">
      <img src="${photos[photos.length - 1]}" class="photo"
        onerror="this.parentNode.innerHTML='<div class=welcome-text>The End</div>'">
    </div>
  `;
  book.appendChild(backCover);
  pages.push(backCover);

  const totalPages = pages.length;

  function updateButtons() {
    document.getElementById("prevBtn").disabled = currentPage === 0;
    document.getElementById("nextBtn").disabled = currentPage === totalPages;
  }

  function nextPage() {
    if (currentPage < totalPages) {
      const page = pages[currentPage];
      page.classList.add("flipped"); // flip right → left
      currentPage++;
      updateButtons();
    }
  }

  function previousPage() {
    if (currentPage > 0) {
      currentPage--;
      const page = pages[currentPage];
      page.classList.remove("flipped");
    }
    updateButtons();
  }

  function resetBook() {
    pages.forEach((p) => p.classList.remove("flipped"));
    currentPage = 0;
    updateButtons();
  }

  updateButtons();
</script>


    <!-- ======= Theme ======= -->
    <loki-theme
      class="btn-loki position-fixed bottom-0 end-0 mb-3 me-3 rounded-2"
    ></loki-theme>

    <!-- Vendor JS Files -->
    <script src="../assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../assets/js/loki.js"></script>
  </body>
</html>
