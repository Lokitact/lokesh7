<!DOCTYPE html>
<html
  lang="en"
  data-loki-theme="auto"
  data-loki-theme-color="green"
  class="h-100"
>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Age Calculator</title>

    <!-- Vendor CSS Files -->
    <link
      href="../assets/vendor/bootstrap/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="../assets/vendor/bootstrap-icons/bootstrap-icons.min.css"
      rel="stylesheet"
    />

    <!-- Template Main CSS File -->
    <link href="../assets/css/loki.css" rel="stylesheet" />
    <script>
      document.documentElement.setAttribute(
        "data-loki-theme-color",
        localStorage.getItem("data-loki-theme-color")
      );
      document.documentElement.setAttribute(
        "data-loki-theme",
        localStorage.getItem("theme")
      );
      document.documentElement.setAttribute(
        "data-bs-theme",
        localStorage.getItem("theme")
      );
    </script>
  </head>

  <body class="d-flex flex-column h-100">
    <div class="card border-loki m-auto shadow-lg" style="max-width: 24rem">
      <div class="card-header border-loki text-center py-3">
        <h4 class="card-title mb-0">
          <i class="bi bi-calculator"></i> Age Calculator
        </h4>
      </div>
      <div class="card-body">
        <div class="d-flex mb-3">
          <input type="date" id="date" class="form-control" />
          <button class="btn btn-loki ms-2" id="calculateBtn">
            <i class="bi bi-play-circle"></i>
          </button>
        </div>
        <div id="preview" class="mt-3"></div>
      </div>
      <div class="card-footer text-center border-loki">
        <small class="text-muted">Designed By Lokesh</small>
      </div>
    </div>

    <script type="module">
      import { calculateAge } from "../assets/js/ageCalculator.js";

      document.getElementById("calculateBtn").addEventListener("click", () => {
        const date = document.getElementById("date").value;
        if (!date) return;

        const age = calculateAge(date);
        const preview = document.getElementById("preview");

        preview.innerHTML = `
    <div class="text-center mb-3 d-flex">
      <div><strong class="text-muted"><i class="bi bi-calendar-event"></i> Current Date:</strong> ${age.today.toLocaleDateString()}</div>
      <div><strong class="text-muted"><i class="bi bi-gift"></i> Birth Date:</strong> ${age.birth.toLocaleDateString()}</div>
    </div>

    <div class="row text-center border-top border-bottom py-2">
      <div class="col"><h5>${age.years}</h5><small>Years</small></div>
      <div class="col"><h5>${age.months}</h5><small>Months</small></div>
      <div class="col"><h5>${age.days}</h5><small>Days</small></div>
    </div>

    <div class="text-center my-3">
      <i class="bi bi-cake2"></i> <strong>Next Birthday:</strong> ${
        age.nextBirthday.months
      } months, ${age.nextBirthday.days} days
    </div>

    <h6 class="mt-4"><i class="bi bi-info-circle"></i> Extra</h6>
    <ul class="list-group list-group-flush small">
      <li class="list-group-item">Years: <span class="float-end">${
        age.extra.years
      }</span></li>
      <li class="list-group-item">Months: <span class="float-end">${
        age.extra.months
      }</span></li>
      <li class="list-group-item">Weeks: <span class="float-end">${
        age.extra.weeks
      }</span></li>
      <li class="list-group-item">Days: <span class="float-end">${
        age.extra.days
      }</span></li>
      <li class="list-group-item">Hours: <span class="float-end">${
        age.extra.hours
      }</span></li>
      <li class="list-group-item">Minutes: <span class="float-end">${
        age.extra.minutes
      }</span></li>
      <li class="list-group-item">Seconds: <span class="float-end">${
        age.extra.seconds
      }</span></li>
      <li class="list-group-item">Milliseconds: <span class="float-end">${
        age.extra.milliseconds
      }</span></li>
    </ul>

    <h6 class="mt-4"><i class="bi bi-calendar-check"></i> Upcoming Birthdays</h6>
    <ul class="list-group list-group-flush small">
      ${age.upcoming
        .map(
          (u) =>
            `<li class="list-group-item">${u.date} <span class="float-end">${u.day}</span></li>`
        )
        .join("")}
    </ul>
  `;
      });
    </script>

    <!-- ======= Theme ======= -->
    <loki-theme
      class="btn-loki position-fixed bottom-0 end-0 mb-3 me-3 rounded-2"
    ></loki-theme>

    <!-- ======= Footer ======= -->
    <!-- <loki-footer class="mt-auto loki-fill-ter"></loki-footer> -->

    <!-- Vendor JS Files -->
    <script src="../assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

    <!-- Template Main JS File -->
    <script type="module" src="../assets/js/loki.js"></script>
  </body>
</html>
